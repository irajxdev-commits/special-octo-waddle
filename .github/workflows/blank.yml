- name: Create RDP User with Fixed Password
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "rdpuser"
          $password = "RdpUser!2026" # Must meet Windows complexity rules; prefer secrets.RDP_PASSWORD

          $securePass = ConvertTo-SecureString -String $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if (-not $existingUser) {
              New-LocalUser `
                  -Name $username `
                  -Password $securePass `
                  -FullName "RDP User" `
                  -Description "Automated RDP access account" `
                  -AccountNeverExpires `
                  -PasswordNeverExpires
          } else {
              Set-LocalUser -Name $username -Password $securePass -PasswordNeverExpires
          }

          $groups = @("Administrators", "Remote Desktop Users")
          foreach ($group in $groups) {
              $member = Get-LocalGroupMember -Group $group -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like "*\$username" -or $_.Name -eq $username }
              if (-not $member) {
                  Add-LocalGroupMember -Group $group -Member $username
              }
          }

          $verifyUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if (-not $verifyUser) {
              Write-Error "User creation failed for '$username'."
              exit 1
          }

          "RDP_CREDS=User: $username | Password: $password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Successfully configured local user '$username'."
