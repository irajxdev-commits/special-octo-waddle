name: Create RDP User with Fixed Password
  shell: pwsh
  run: |
    $username = "AI"
    $password = "AI"
    $securePass = ConvertTo-SecureString $password -AsPlainText -Force

    $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

    if (-not $user) {
        New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires -ErrorAction Stop
        Write-Host "Created local user '$username'"
    }
    else {
        $user | Set-LocalUser -Password $securePass -PasswordNeverExpires $true
        Write-Host "User '$username' already exists – password updated"
    }

    Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
    Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

    "RDP_CREDS=User: $username | Password: $password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
        Write-Error "User creation/update failed"
        exit 1
    }

    Write-Host "RDP user '$username' is ready."
